<section class="menu-page">
  <div class="header-banner">
    <div class="container container-content">
      <h1 class="text-white">Our Menu</h1>
      <p class="text-gold subtitle">Handcrafted coffee & artisan snacks</p>
    </div>
  </div>



  <div class="container main-content">
    <!-- Filters -->
    <div class="menu-filters">
      <!-- (Optional: Filter implementation if requested) -->
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="loading">
      <div class="loader"></div>
      <p>Brewing your menu...</p>
    </div>

    <!-- Error State -->
    <div class="error-state" *ngIf="errorMessage">
      <p>{{ errorMessage }}</p>
      <button class="btn-primary" (click)="ngOnInit()">Try Again</button>
    </div>

    <div class="menu-layout">
      <!-- Menu Grid -->
      <div class="menu-grid" *ngIf="!loading && !errorMessage && filteredItems.length > 0">
        <div class="menu-card fade-in" *ngFor="let item of filteredItems">
          <div class="card-img">
            <img [src]="item.image || fallbackImage" [alt]="item.name" loading="lazy" (error)="onImageError($event)">
            <div class="category-badge">
              {{ item.category }}
            </div>
          </div>
          <div class="card-content">
            <h3>{{ item.name }}</h3>
            <p class="description">{{ item.description }}</p>
            <div class="card-footer">
              <span class="price">₹{{ item.price | number:'1.2-2' }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && filteredItems.length === 0">
      <span class="icon">☕</span>
      <p>No items found in this section.</p>
    </div>
  </div>
</section>
