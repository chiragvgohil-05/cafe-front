<div class="dashboard-container">
    <div class="page-header">
        <h1>Dashboard</h1>
        <p class="subtitle">Welcome back! Here's what's happening today.</p>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of stats">
            <div class="stat-info">
                <span class="stat-label">{{ stat.label }}</span>
                <div class="stat-value">{{ stat.value }}</div>
            </div>
            <div class="stat-icon" [ngClass]="stat.iconBg">
                <svg *ngIf="stat.label === 'Active Customers'" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <svg *ngIf="stat.label === 'Growth Rate'" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                    <polyline points="17 6 23 6 23 12"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Dashboard content for other functionalities or placeholder for reservations -->
        <div class="grid-card">
            <div class="card-header">
                <h2>Reservation Management</h2>
                <button class="view-all" routerLink="/admin/reservations">Go to Reservations</button>
            </div>
            <p style="padding: 20px;">Use the sidebar to manage reservations and view table availability.</p>
        </div>
    </div>
</div>
